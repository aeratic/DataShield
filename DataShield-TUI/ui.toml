# DataShield TUI — interface "chrome" (edit freely).
#
# Unlike settings.toml (which the app rewrites when you change a setting from
# the settings page), THIS file is only ever READ by the app: your comments and
# formatting are safe. Delete the file to regenerate this default. Every key is
# optional — a missing key falls back to the value shown here, and a malformed
# file falls back entirely to the built-in default (with a status-bar note), so
# an edit can never keep the app from starting.

# Bumping this in the shipped default regenerates an older on-disk copy (the old
# one is kept as ui.toml.bak) — this is how new chrome defaults reach you.
version = 4

[input]
# The character(s) shown before the command line. Any glyph works: / > ❯ : #
# An empty string ("") hides the prompt. Clamped to a few columns.
prompt = "/"

[panel]
# Width of the left (vault list) panel as a percentage of the screen (20–60);
# the contextual ~ panel takes the rest.
left_percent = 38

[brand]
# Logo colour: "green" (the brand), "accent" (follows the current theme), or a
# hex colour like "#7ec8d6". The pixel-Saturn art itself lives in logo.txt.
color = "green"
# Optional tagline shown under the logo, per language.
tagline.en = "your terminal vault"
tagline.it = "il tuo caveau nel terminale"

[header]
