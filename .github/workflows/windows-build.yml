name: windows-build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p datashield-tui
      - run: cargo test --release -p datashield-core
      - uses: actions/upload-artifact@v4
        with:
          name: datashield-tui-windows-x86_64
          path: target/release/datashield-tui.exe
