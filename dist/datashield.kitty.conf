# DataShield — dedicated terminal profile (kitty).
#
# DataShield ships with its OWN terminal window: the launcher starts kitty with
# this config, so every visual knob here belongs to DataShield alone and never
# touches the user's everyday terminal. The BRASS LEDGER paper (#0F0D0A) is the
# terminal background itself, so the window padding is paper too — no foreign
# border around the app (the fix for the "edge shows my terminal's background"
# problem: the padding is always painted in the background colour).

# ---- identity ----------------------------------------------------------
# the BRASS LEDGER paper + sand ink
background            #0F0D0A
foreground            #E8E2D3
cursor                #D9A855
cursor_text_color     #171006
selection_background  #2A2213
selection_foreground  #F4CE82

# ---- typography --------------------------------------------------------
font_family           JetBrainsMono Nerd Font Mono
bold_font             JetBrainsMono Nerd Font Mono Bold
italic_font           JetBrainsMono Nerd Font Mono Italic
font_size             11.5

# ---- window ------------------------------------------------------------
# padding painted in `background` (the paper) — never a foreign border
window_padding_width  6
hide_window_decorations titlebar-only
remember_window_size  no
initial_window_width  110c
initial_window_height 34c
confirm_os_window_close 0

# ---- behaviour ---------------------------------------------------------
# needed by DataShield's optional blur/translucency setting
allow_remote_control  yes
dynamic_background_opacity yes
# kitty graphics protocol (crisp favicons) is on by default
enable_audio_bell     no
cursor_blink_interval 0.53
scrollback_lines      0
