[package]
name = "datashield-core"
version = "0.1.0"
edition = "2021"
description = "DataShield core: vault format, cryptography, sync and data model shared by every DataShield front-end"
authors = ["Bruno Galimi"]
license = "GPL-3.0-or-later"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
chacha20poly1305 = "0.10"
eax = "0.5"
ccm = "0.5"
ocb3 = "0.1"
ascon-aead = "0.4"
deoxys = "0.1"
argon2 = "0.5"
scrypt = { version = "0.11", default-features = false }
pbkdf2 = "0.12"
bcrypt-pbkdf = "0.10"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
zeroize = "1"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.2"
anyhow = "1"
totp-rs = "5"

[dev-dependencies]
tempfile = "3"
